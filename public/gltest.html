<!DOCTYPE html><html><head><title>gltest</title></head><body data-motion="full">
<pre id="o"></pre>
<script>
var o=document.getElementById('o'), c=document.createElement('canvas');
var g=c.getContext('webgl'); o.textContent='webgl:'+(!!g)+' webgl2:'+(!!document.createElement('canvas').getContext('webgl2'));
if(g){var d=g.getExtension('WEBGL_debug_renderer_info');o.textContent+=' renderer:'+(d?g.getParameter(d.UNMASKED_RENDERER_WEBGL):g.getParameter(g.RENDERER));}
</script>
<script src="./field.js"></script>
<script>setTimeout(function(){o.textContent+=' field:'+document.body.getAttribute('data-field')+' canvas:'+!!document.querySelector('canvas.field-fx');document.title='gltest '+o.textContent;},500);</script>
</body></html>
